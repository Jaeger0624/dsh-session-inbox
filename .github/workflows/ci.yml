name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax — host half
        run: node --check index.js
      - name: Syntax — browser half
        run: node --check lib/client.js
      - name: JSON resources parse
        run: |
          node -e "for (const f of ['package.json','locale/zh.json','locale/en.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Offline smoke test
        run: node test/smoke.mjs
